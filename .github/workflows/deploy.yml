name: Deploy to Cloudflare

# The whole Cloudflare setup runs here: D1 database, migrations, Worker secrets, deploy.
# Every step is idempotent, so the first run sets things up and later runs just deploy.
# Off until you turn it on: set the repository variable PURSER_DEPLOY to "enabled".
# See README "Deploy to Cloudflare" for the secrets it needs.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.PURSER_DEPLOY == 'enabled'
    runs-on: ubuntu-latest
    # Add required reviewers to this environment if you want to approve each deploy.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check required secrets
        env:
          VAULT_MASTER_KEY: ${{ secrets.VAULT_MASTER_KEY }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VAULT_MASTER_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; missing=1; fi
          done
          exit $missing

      # Finds the "purser" D1 database, creating it on the first run, and points wrangler at it.
      - name: Ensure D1 database
        id: d1
        run: npx tsx src/scripts/ensure-d1.ts

      - name: Point wrangler.jsonc at it
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ steps.d1.outputs.id }}/" wrangler.jsonc

      # Applies any new files in migrations/ before the new code goes live. Every migration so
      # far is additive, so the old Worker keeps working in between.
      - name: Migrate database
        run: npx wrangler d1 migrations apply DB --remote

      # Secrets go to the Worker with the deploy, from a temp file that never leaves the runner.
      # PLAID_* are optional: without them the vault runs with Plaid disabled.
      # When PLAID_SECRET_PRODUCTION is set the vault runs against Plaid production (real
      # accounts); otherwise it uses PLAID_SECRET against the sandbox.
      - name: Deploy Worker
        env:
          VAULT_MASTER_KEY: ${{ secrets.VAULT_MASTER_KEY }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET_PRODUCTION || secrets.PLAID_SECRET }}
          PLAID_ENV: ${{ secrets.PLAID_SECRET_PRODUCTION != '' && 'production' || 'sandbox' }}
        run: |
          echo "Plaid environment: $PLAID_ENV"
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          node -e '
            const keys = ["VAULT_MASTER_KEY", "PLAID_CLIENT_ID", "PLAID_SECRET"];
            const out = Object.fromEntries(keys.filter((k) => process.env[k]).map((k) => [k, process.env[k]]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 });
          ' "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" --var "PLAID_ENV:$PLAID_ENV"
          rm -f "$secrets_file"
